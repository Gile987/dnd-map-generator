name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check TypeScript
        run: npm run typecheck:tests
      - name: Run unit tests
        run: npm test -- --maxWorkers=1
      - name: Build application
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        # Keep aligned with the resolved Playwright version in package-lock.json.
        playwright-version: ['1.64.1']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright-version }}-noble
      options: --init --ipc=host
    env:
      CI: 'true'
      PLAYWRIGHT_VERSION: ${{ matrix.playwright-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Check Playwright container version
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages['node_modules/playwright'].version;
          if (version !== process.env.PLAYWRIGHT_VERSION) {
            throw new Error(`Playwright ${version} requires a matching container. Update playwright-version in checks.yml.`);
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run browser tests
        run: npm run test:e2e
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
