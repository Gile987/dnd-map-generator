name: Browser tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        # Keep aligned with the resolved Playwright version in package-lock.json.
        playwright-version: ['1.64.1']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright-version }}-noble
      options: --init --ipc=host
    env:
      CI: 'true'
      PLAYWRIGHT_VERSION: ${{ matrix.playwright-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Check Playwright container version
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages['node_modules/playwright'].version;
          if (version !== process.env.PLAYWRIGHT_VERSION) {
            throw new Error(`Playwright ${version} requires a matching container. Update playwright-version in browser-tests.yml.`);
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run browser tests
        run: npm run test:e2e
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
