<dialog
  #dialog
  class="character-picker"
  aria-labelledby="character-picker-title"
  aria-describedby="character-picker-hint"
  (close)="closed()"
>
  <header>
    <div>
      <span class="eyebrow">Find your atmosphere</span>
      <h2 id="character-picker-title" tabindex="-1" autofocus>Choose character</h2>
    </div>
    <button class="close-button" type="button" aria-label="Close characters" (click)="close()">
      <forge-icon name="plus" />
    </button>
  </header>
  <p id="character-picker-hint">
    Samples show a fixed example. Your choice stays pending until Generate.
  </p>
  <div class="character-catalog">
    @if (visible()) {
    <fieldset [disabled]="disabled()">
      <legend class="sr-only">Available characters</legend>
      <div class="character-options">
        @for (option of options(); track option.id) {
        <label class="character-option" [class.selected]="selected() === option.id">
          <input
            type="radio"
            name="map-character"
            [value]="option.id"
            [checked]="selected() === option.id"
            [attr.aria-labelledby]="'character-' + option.id + '-label'"
            [attr.aria-describedby]="'character-' + option.id + '-description'"
            (change)="choose(option)"
            (focus)="reveal($event)"
          />
          <img [forgeCharacterPreview]="option" width="480" height="300" alt="" />
          <span class="character-copy"
            ><strong [id]="'character-' + option.id + '-label'">{{ option.label }}</strong>
            <span [id]="'character-' + option.id + '-description'">{{ option.description }}</span>
          </span>
        </label>
        }
      </div>
    </fieldset>
    }
  </div>
  <footer>
    <span role="status">Selected: {{ selectedLabel() }}</span
    ><button class="done-button" type="button" (click)="close()">
      Done <forge-icon name="check" />
    </button>
  </footer>
</dialog>
